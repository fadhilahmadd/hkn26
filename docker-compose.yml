version: "3.8"
services:
  nextjs_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_standalone
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
